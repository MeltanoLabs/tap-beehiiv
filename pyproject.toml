[project]
name = "tap-beehiiv"
version = "0.0.1"
description = "Singer tap for beehiiv, built with the Meltano Singer SDK."
readme = "README.md"
authors = [
    { name = "Naveen Kumar A" },
    { name = "Meltano" },
]
keywords = [
    "ELT",
    "beehiiv",
    "Singer",
    "Meltano",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
dependencies = [
    "singer-sdk~=0.54.9",
    "requests~=2.34.2",
    "typing-extensions>=4.5.0; python_version < '3.13'",
]

[project.scripts]
# CLI declaration
tap-beehiiv = 'tap_beehiiv.tap:TapBeehiiv.cli'

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = [
    "pytest>=9.0.3",
    "pytest-github-actions-annotate-failures>=0.3",
    "responses>=0.25.8",
    "singer-sdk[testing]",
]
typing = [
    "mypy>=1.19.1",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "tap_beehiiv",
]

[tool.pytest]
minversion = "9.0"
addopts = [
    "--durations=10",
]

[tool.mypy]
warn_unused_configs = true

[tool.ruff]
line-length = 100
required-version = ">=0.14"

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",  # missing-trailing-comma
    "CPY",     # copyright notices
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = [
    "hatchling>=1,<2",
]
build-backend = "hatchling.build"

[tool.tox]
min_version = "4.22"
requires = [
    "tox>=4.22",
    "tox-uv",
]
env_list = [
    "typing",
    "py314",
    "py313",
    "py312",
    "py311",
    "py310",
]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
pass_env = [
    "GITHUB_*",
    "TAP_BEEHIIV_*",
]
dependency_groups = [ "test" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]

[tool.tox.env.typing]
dependency_groups = [ "test", "typing" ]
commands = [
    [ "mypy", { replace = "posargs", default = [ "tap_beehiiv", "tests" ], extend = true } ],
]
